# The SSB command-line handler registration lived here and had to go: the
# feature layer purged PWA/SSB, so
# resource://noraneko/modules/pwa/SsbCommandLineHandler.sys.mjs no longer
# exists. Because the class was registered in the 'command-line-handler'
# category, Gecko instantiated it during startup, failed to load the module,
# and the browser exited before a window ever appeared — a hard startup crash
# with only "Missing chrome or resource URL" to show for it.
#
# The Linux taskbar class below is a C++ type with no such dependency, so it
# stays until PWA is removed from the runtime as well.
Classes = []

if buildconfig.substs['MOZ_WIDGET_TOOLKIT'] == 'gtk':
    Classes += [
        {
            'cid': '{d99f0c02-5b68-4c44-8f10-cfdd1ee53c74}',
            'contract_ids': [
                '@noraneko.org/pwa/linux-taskbar;1',
            ],
            'type': 'mozilla::FloorpLinuxTaskbar',
            'headers': [
                '/.github/assets/pre-build/pwa/linux/FloorpLinuxTaskbar.h',
            ],
        },
    ]

